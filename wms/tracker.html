<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picker Route Tracker - WMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ── */
        .top-bar {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-bar .spacer { flex: 1; }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge.live {
            background: rgba(16,185,129,0.25);
            border: 1px solid rgba(16,185,129,0.5);
            color: #6ee7b7;
        }

        .status-badge.live::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn-top {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .btn-top:hover { background: rgba(255,255,255,0.2); }
        .btn-top.danger { border-color: rgba(239,68,68,0.5); color: #fca5a5; }
        .btn-top.danger:hover { background: rgba(239,68,68,0.2); }

        /* ── Main Layout ── */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-section {
            border-bottom: 1px solid #f0f0f0;
            padding: 12px;
        }

        .sidebar-section h3 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .picker-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .picker-card {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.15s;
            border: 2px solid transparent;
            position: relative;
        }

        .picker-card:hover { background: #f9fafb; }
        .picker-card.hidden-picker { opacity: 0.45; }

        .picker-card .color-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .picker-card .picker-name {
            font-size: 13px;
            font-weight: 600;
            color: #111827;
            display: flex;
            align-items: center;
        }

        .picker-card .picker-meta {
            font-size: 11px;
            color: #6b7280;
            margin-top: 3px;
            padding-left: 16px;
        }

        .picker-card .picker-actions {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            gap: 4px;
        }

        .picker-card:hover .picker-actions { display: flex; }

        .btn-icon {
            width: 24px; height: 24px;
            border: none;
            border-radius: 4px;
            background: #f3f4f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #6b7280;
        }

        .btn-icon:hover { background: #e5e7eb; color: #111827; }
        .btn-icon.red:hover { background: #fee2e2; color: #dc2626; }

        .active-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            margin-left: 5px;
            animation: pulse-dot 1.5s infinite;
        }

        .idle-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #d1d5db;
            display: inline-block;
            margin-left: 5px;
        }

        /* Config section */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .config-item label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .config-item input, .config-item select {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 12px;
        }

        .btn-apply {
            margin-top: 8px;
            width: 100%;
            padding: 6px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-apply:hover { background: #1d4ed8; }

        /* Stats strip */
        .stats-strip {
            display: flex;
            gap: 0;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 6px 4px;
        }

        .stat-item .sv {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            line-height: 1;
        }

        .stat-item .sl {
            font-size: 9px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ── Canvas area ── */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #e5e7eb;
            padding: 12px;
            gap: 8px;
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        #warehouseCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Tooltip */
        .canvas-tooltip {
            position: absolute;
            background: rgba(17,24,39,0.9);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 10;
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            pointer-events: none;
        }

        .empty-state i { font-size: 48px; margin-bottom: 12px; color: #d1d5db; }
        .empty-state p { font-size: 14px; }
        .empty-state small { font-size: 12px; margin-top: 4px; }

        /* Legend strip below canvas */
        .legend-strip {
            background: white;
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .legend-strip .leg-title {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #374151;
        }

        .legend-swatch {
            width: 24px; height: 4px;
            border-radius: 2px;
        }

        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <h1><i class="fas fa-route"></i> Picker Route Tracker</h1>
    <div class="status-badge live" id="liveStatus">LIVE</div>
    <div id="ipInfoBox" style="
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        title='Click to copy'">
        <i class="fas fa-wifi"></i>
        <span id="ipInfoText" style="font-family: monospace; letter-spacing:0.03em;">detecting…</span>
        <i class="fas fa-copy" style="opacity:0.6; font-size:10px;" id="copyIcon"></i>
    </div>
    <div class="spacer"></div>
    <button class="btn-top" onclick="refreshRoutes()">
        <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh
    </button>
    <button class="btn-top" onclick="toggleAutoRefresh()" id="autoRefreshBtn">
        <i class="fas fa-play"></i> Auto
    </button>
    <button class="btn-top danger" onclick="clearAllRoutes()">
        <i class="fas fa-trash"></i> Clear All
    </button>
</div>

<!-- Main -->
<div class="main">

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Stats -->
        <div class="sidebar-section">
            <h3>Status</h3>
            <div class="stats-strip">
                <div class="stat-item">
                    <div class="sv" id="statActive">0</div>
                    <div class="sl">Active</div>
                </div>
                <div class="stat-item">
                    <div class="sv" id="statTotal">0</div>
                    <div class="sl">Pickers</div>
                </div>
                <div class="stat-item">
                    <div class="sv" id="statPoints">0</div>
                    <div class="sl">Points</div>
                </div>
            </div>
        </div>

        <!-- Warehouse Config -->
        <div class="sidebar-section">
            <h3>Warehouse Grid</h3>
            <div class="config-grid">
                <div class="config-item">
                    <label>Aisles (cols)</label>
                    <input type="number" id="cfgCols" value="8" min="2" max="26">
                </div>
                <div class="config-item">
                    <label>Rows</label>
                    <input type="number" id="cfgRows" value="8" min="2" max="30">
                </div>
                <div class="config-item">
                    <label>Start Aisle</label>
                    <input type="text" id="cfgStartCol" value="A" maxlength="1" style="text-transform:uppercase">
                </div>
                <div class="config-item">
                    <label>Start Row</label>
                    <input type="number" id="cfgStartRow" value="1" min="1">
                </div>
            </div>
            <button class="btn-apply" onclick="applyConfig()">
                <i class="fas fa-check"></i> Apply
            </button>
        </div>

        <!-- Pickers -->
        <div class="sidebar-section" style="border-bottom:none; padding-bottom:0;">
            <h3>Pickers</h3>
        </div>
        <div class="picker-list" id="pickerList">
            <div style="text-align:center; color:#9ca3af; font-size:12px; padding:20px;">
                No pickers tracked yet
            </div>
        </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area">
        <div class="canvas-wrapper">
            <canvas id="warehouseCanvas"></canvas>
            <div class="canvas-tooltip" id="canvasTooltip"></div>
            <div class="empty-state" id="emptyState">
                <i class="fas fa-route"></i>
                <p>Waiting for picker location updates</p>
                <small id="emptyStateUrl">POST to http://&lt;pc-ip&gt;:8766/notify with type "location"</small>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend-strip" id="legendStrip">
            <span class="leg-title">Legend</span>
            <div class="legend-item">
                <div class="legend-swatch" style="background:#374151;"></div>
                Route path
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#374151;"></div>
                Current position
            </div>
            <div class="legend-item" style="margin-left:auto; font-size:11px; color:#6b7280;" id="lastUpdateLabel">
                Never updated
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const PICKER_COLORS = [
    '#3b82f6', // blue
    '#ef4444', // red
    '#10b981', // green
    '#f59e0b', // amber
    '#8b5cf6', // violet
    '#ec4899', // pink
    '#14b8a6', // teal
    '#f97316', // orange
    '#6366f1', // indigo
    '#84cc16', // lime
    '#0ea5e9', // sky
    '#a855f7', // purple
];

const IDLE_THRESHOLD_MS = 60000; // 60s — picker considered idle

// ============================================================
// STATE
// ============================================================
let routes      = {};      // { pickerId: [ {zone, x, y, pickerName, timestamp}, ... ] }
let pickerMeta  = {};      // { pickerId: { name, color, colorIdx, visible } }
let colorCursor = 0;
let autoRefresh = false;
let autoTimer   = null;
let pulseFrame  = 0;
let animTimer   = null;
let hasAnyData  = false;

let warehouseConfig = {
    cols:      8,
    rows:      8,
    startCol:  0,   // 0 = 'A'
    startRow:  1
};

// ============================================================
// INIT
// ============================================================
const canvas  = document.getElementById('warehouseCanvas');
const ctx     = canvas.getContext('2d');
const wrapper = canvas.parentElement;

function init() {
    resizeCanvas();
    window.addEventListener('resize', () => { resizeCanvas(); drawWarehouse(); });

    // Hover tooltip
    canvas.addEventListener('mousemove', onCanvasMouseMove);
    canvas.addEventListener('mouseleave', () => {
        document.getElementById('canvasTooltip').style.display = 'none';
    });

    // Live push from C# (MobileNotificationListener broadcasts to all WebViews)
    window.handleMobileNotification = function(notif) {
        if (notif.type === 'location' && notif.pickerId) {
            addPoint(notif);
            drawWarehouse();
            updateSidebar();
            updateLastUpdate();
        }
    };

    // Fetch PC IP from C# listener info
    loadListenerInfo();

    // Initial data load
    loadRoutesFromBackend();

    // Start animation loop for pulsing dots
    animationLoop();
}

function resizeCanvas() {
    canvas.width  = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
}

// ============================================================
// DATA
// ============================================================
function addPoint(notif) {
    const id = notif.pickerId;

    if (!pickerMeta[id]) {
        const colorIdx = colorCursor % PICKER_COLORS.length;
        colorCursor++;
        pickerMeta[id] = {
            name:     notif.pickerName || id,
            color:    PICKER_COLORS[colorIdx],
            colorIdx: colorIdx,
            visible:  true
        };
    }

    // Update name if provided
    if (notif.pickerName) pickerMeta[id].name = notif.pickerName;

    if (!routes[id]) routes[id] = [];

    routes[id].push({
        zone:      notif.zone  || gridCoordToZone(notif.x || 0, notif.y || 0),
        x:         notif.x     || 0,
        y:         notif.y     || 0,
        timestamp: notif.timestamp || new Date().toISOString()
    });

    // Keep at most 1000 points per picker (memory safety)
    if (routes[id].length > 1000) routes[id].shift();

    hasAnyData = true;
    document.getElementById('emptyState').style.display = 'none';
}

function gridCoordToZone(x, y) {
    const col = String.fromCharCode(65 + warehouseConfig.startCol + Math.floor(x));
    const row = warehouseConfig.startRow + Math.floor(y);
    return `${col}${row}`;
}

// ============================================================
// BACKEND COMMUNICATION
// ============================================================
function loadListenerInfo() {
    if (!(window.chrome && window.chrome.webview)) {
        document.getElementById('ipInfoText').textContent = 'localhost:8766/notify';
        return;
    }
    const reqId = 'tracker_listenerinfo_' + Date.now();
    window.pendingRequests = window.pendingRequests || {};
    window.pendingRequests[reqId] = function(err, data) {
        if (err) { console.error('[Tracker] getMobileListenerInfo error:', err); return; }
        try {
            const info = typeof data === 'string' ? JSON.parse(data) : data;
            const url  = info.notifyUrl || ('http://localhost:' + (info.port || 8766) + '/notify');

            // Top bar chip
            document.getElementById('ipInfoText').textContent = url;

            // Empty state
            document.getElementById('emptyStateUrl').textContent = 'POST to ' + url + '  |  type: "location"';

            // Click chip to copy URL
            const box = document.getElementById('ipInfoBox');
            box.title = 'Click to copy: ' + url;
            box.onclick = function() {
                navigator.clipboard.writeText(url).then(() => {
                    const icon = document.getElementById('copyIcon');
                    icon.className = 'fas fa-check';
                    icon.style.color = '#6ee7b7';
                    setTimeout(() => {
                        icon.className = 'fas fa-copy';
                        icon.style.color = '';
                    }, 1500);
                });
            };

            // Show all IPs if more than one NIC
            if (info.ips && info.ips.length > 1) {
                console.log('[Tracker] All local IPs:', info.ips);
            }
        } catch(e) { console.error('[Tracker] Parse listenerInfo:', e); }
    };
    window.chrome.webview.postMessage({ action: 'getMobileListenerInfo', requestId: reqId });
}

function loadRoutesFromBackend() {
    if (window.chrome && window.chrome.webview) {
        const reqId = 'tracker_getroutes_' + Date.now();
        window.pendingRequests = window.pendingRequests || {};
        window.pendingRequests[reqId] = function(err, data) {
            if (err) { console.error('[Tracker] getPickerRoutes error:', err); return; }
            try {
                const parsed = typeof data === 'string' ? JSON.parse(data) : data;
                applyRouteData(parsed);
            } catch(e) { console.error('[Tracker] Parse error:', e); }
        };
        window.chrome.webview.postMessage({ action: 'getPickerRoutes', requestId: reqId });
    }
}

function applyRouteData(data) {
    // data = { pickerId: [ notif, ... ], ... }
    for (const [pickerId, points] of Object.entries(data || {})) {
        for (const pt of points) {
            addPoint({ ...pt, pickerId });
        }
    }
    drawWarehouse();
    updateSidebar();
    if (hasAnyData) updateLastUpdate();
}

function refreshRoutes() {
    const icon = document.getElementById('refreshIcon');
    icon.style.animation = 'spin 0.6s linear';
    setTimeout(() => icon.style.animation = '', 700);
    loadRoutesFromBackend();
}

function toggleAutoRefresh() {
    autoRefresh = !autoRefresh;
    const btn = document.getElementById('autoRefreshBtn');
    if (autoRefresh) {
        btn.innerHTML = '<i class="fas fa-pause"></i> Auto';
        btn.style.background = 'rgba(16,185,129,0.25)';
        btn.style.borderColor = 'rgba(16,185,129,0.5)';
        autoTimer = setInterval(refreshRoutes, 3000);
    } else {
        btn.innerHTML = '<i class="fas fa-play"></i> Auto';
        btn.style.background = '';
        btn.style.borderColor = '';
        clearInterval(autoTimer);
    }
}

// ============================================================
// DRAWING
// ============================================================
function drawWarehouse() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    for (const [id, points] of Object.entries(routes)) {
        if (!pickerMeta[id]?.visible || points.length === 0) continue;
        drawRoute(id, points);
    }
    for (const [id, points] of Object.entries(routes)) {
        if (!pickerMeta[id]?.visible || points.length === 0) continue;
        drawCurrentDot(id, points[points.length - 1]);
    }
}

function drawGrid() {
    const { cols, rows, startCol, startRow } = warehouseConfig;
    const cw = canvas.width  / cols;
    const ch = canvas.height / rows;
    const fontSize = Math.max(9, Math.min(cw, ch) * 0.28);

    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
            const x = c * cw;
            const y = r * ch;

            // Aisle shading
            ctx.fillStyle = (c % 2 === 0) ? '#f8fafc' : '#f1f5f9';
            ctx.fillRect(x, y, cw, ch);

            // Border
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(x, y, cw, ch);

            // Zone label
            const colChar = String.fromCharCode(65 + startCol + c);
            const rowNum  = startRow + r;
            ctx.fillStyle = '#94a3b8';
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${colChar}${rowNum}`, x + cw / 2, y + ch / 2);
        }
    }
}

function zoneToCanvasXY(zone) {
    const match = (zone || '').match(/^([A-Za-z]+)(\d+)$/);
    if (!match) return null;

    const colStr = match[1].toUpperCase();
    let colAbs = 0;
    for (let i = 0; i < colStr.length; i++) {
        colAbs = colAbs * 26 + (colStr.charCodeAt(i) - 64);
    }
    colAbs -= 1; // 0-based absolute col index (A=0)

    const rowAbs = parseInt(match[2]) - 1; // 0-based absolute row

    const col = colAbs - warehouseConfig.startCol;
    const row = rowAbs - (warehouseConfig.startRow - 1);

    const { cols, rows } = warehouseConfig;
    if (col < 0 || col >= cols || row < 0 || row >= rows) return null;

    const cw = canvas.width  / cols;
    const ch = canvas.height / rows;
    return { x: col * cw + cw / 2, y: row * ch + ch / 2 };
}

function drawRoute(pickerId, points) {
    const color = pickerMeta[pickerId].color;
    const coords = points.map(p => zoneToCanvasXY(p.zone)).filter(Boolean);
    if (coords.length < 2) return;

    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth   = 3;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.globalAlpha = 0.75;

    ctx.moveTo(coords[0].x, coords[0].y);
    for (let i = 1; i < coords.length; i++) {
        ctx.lineTo(coords[i].x, coords[i].y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Start dot (smaller)
    const start = coords[0];
    ctx.beginPath();
    ctx.arc(start.x, start.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.globalAlpha = 1;
}

function drawCurrentDot(pickerId, point) {
    const coords = zoneToCanvasXY(point.zone);
    if (!coords) return;
    const color = pickerMeta[pickerId].color;
    const name  = pickerMeta[pickerId].name;
    const pulse = 0.6 + 0.4 * Math.abs(Math.sin(pulseFrame * 0.05));

    // Outer pulse ring
    ctx.beginPath();
    ctx.arc(coords.x, coords.y, 16 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = color + '30';
    ctx.fill();

    // Inner filled circle
    ctx.beginPath();
    ctx.arc(coords.x, coords.y, 11, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Picker initial
    const initial = (name.charAt(0) || pickerId.charAt(0)).toUpperCase();
    ctx.fillStyle   = 'white';
    ctx.font        = 'bold 10px sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(initial, coords.x, coords.y);
}

function animationLoop() {
    pulseFrame++;
    drawWarehouse();
    animTimer = requestAnimationFrame(animationLoop);
}

// ============================================================
// SIDEBAR
// ============================================================
function updateSidebar() {
    const now = Date.now();
    let active = 0;
    let totalPoints = 0;
    const ids = Object.keys(routes);

    // Stats
    for (const id of ids) {
        const pts = routes[id];
        totalPoints += pts.length;
        if (pts.length > 0) {
            const last = new Date(pts[pts.length - 1].timestamp).getTime();
            if (!isNaN(last) && (now - last) < IDLE_THRESHOLD_MS) active++;
        }
    }

    document.getElementById('statActive').textContent = active;
    document.getElementById('statTotal').textContent  = ids.length;
    document.getElementById('statPoints').textContent = totalPoints;

    // Picker cards
    const list = document.getElementById('pickerList');
    if (ids.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#9ca3af;font-size:12px;padding:20px;">No pickers tracked yet</div>';
        return;
    }

    list.innerHTML = ids.map(id => {
        const meta = pickerMeta[id];
        const pts  = routes[id] || [];
        const last = pts.length > 0 ? pts[pts.length - 1] : null;
        const lastTs = last ? new Date(last.timestamp).getTime() : 0;
        const isActive = !isNaN(lastTs) && (now - lastTs) < IDLE_THRESHOLD_MS;
        const lastZone = last?.zone || '—';
        const lastTime = last ? formatTime(last.timestamp) : '—';

        return `
            <div class="picker-card ${meta.visible ? '' : 'hidden-picker'}"
                 id="pc-${id}" onclick="togglePickerVisibility('${id}')">
                <div class="picker-name">
                    <span class="color-dot" style="background:${meta.color}"></span>
                    ${escHtml(meta.name)}
                    ${isActive
                        ? '<span class="active-dot" title="Active"></span>'
                        : '<span class="idle-dot"   title="Idle"></span>'}
                </div>
                <div class="picker-meta">
                    Zone: <strong>${escHtml(lastZone)}</strong>
                    &nbsp;·&nbsp; ${pts.length} pts
                    &nbsp;·&nbsp; ${lastTime}
                </div>
                <div class="picker-actions">
                    <button class="btn-icon" title="Center on map"
                        onclick="event.stopPropagation(); centerOnPicker('${id}')">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                    <button class="btn-icon red" title="Clear route"
                        onclick="event.stopPropagation(); clearPickerRoute('${id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>`;
    }).join('');

    // Legend
    updateLegend(ids);
}

function updateLegend(ids) {
    const strip = document.getElementById('legendStrip');
    const extra = ids.map(id => {
        const meta = pickerMeta[id];
        return `
            <div class="legend-item">
                <div class="legend-swatch" style="background:${meta.color};"></div>
                ${escHtml(meta.name)}
            </div>`;
    }).join('');

    strip.innerHTML = `
        <span class="leg-title">Legend</span>
        <div class="legend-item"><div class="legend-swatch" style="background:#94a3b8;"></div> Route</div>
        <div class="legend-item"><div class="legend-dot" style="background:#374151;"></div> Position</div>
        ${extra}
        <div style="margin-left:auto;font-size:11px;color:#6b7280;" id="lastUpdateLabel">
            ${document.getElementById('lastUpdateLabel')?.textContent || 'Never updated'}
        </div>`;
}

function updateLastUpdate() {
    const el = document.getElementById('lastUpdateLabel');
    if (el) el.textContent = 'Updated ' + new Date().toLocaleTimeString();
}

// ============================================================
// INTERACTIONS
// ============================================================
function togglePickerVisibility(id) {
    if (!pickerMeta[id]) return;
    pickerMeta[id].visible = !pickerMeta[id].visible;
    updateSidebar();
    drawWarehouse();
}

function clearPickerRoute(id) {
    if (!confirm(`Clear route for ${pickerMeta[id]?.name || id}?`)) return;
    delete routes[id];
    delete pickerMeta[id];
    colorCursor = Object.keys(pickerMeta).length; // reset cursor

    // Re-assign colors to remaining pickers to keep them consistent
    let idx = 0;
    for (const pid of Object.keys(pickerMeta)) {
        pickerMeta[pid].colorIdx = idx;
        pickerMeta[pid].color    = PICKER_COLORS[idx % PICKER_COLORS.length];
        idx++;
    }
    colorCursor = idx;

    hasAnyData = Object.keys(routes).length > 0;
    if (!hasAnyData) document.getElementById('emptyState').style.display = '';

    // Notify C#
    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: 'clearPickerRoute', pickerId: id });
    }

    updateSidebar();
    drawWarehouse();
}

function clearAllRoutes() {
    if (Object.keys(routes).length === 0) return;
    if (!confirm('Clear all picker routes?')) return;
    routes = {};
    pickerMeta = {};
    colorCursor = 0;
    hasAnyData = false;
    document.getElementById('emptyState').style.display = '';

    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: 'clearPickerRoute', pickerId: 'all' });
    }

    updateSidebar();
    drawWarehouse();
}

function centerOnPicker(id) {
    // Visual feedback — flash the dot (implemented by brief color invert via a flag)
    // For now, just ensure the picker is visible
    pickerMeta[id].visible = true;
    drawWarehouse();
}

function applyConfig() {
    const cols      = Math.max(2, Math.min(26, parseInt(document.getElementById('cfgCols').value)  || 8));
    const rows      = Math.max(2, Math.min(30, parseInt(document.getElementById('cfgRows').value)  || 8));
    const startChar = (document.getElementById('cfgStartCol').value || 'A').toUpperCase().charAt(0);
    const startRow  = Math.max(1, parseInt(document.getElementById('cfgStartRow').value) || 1);

    warehouseConfig = {
        cols,
        rows,
        startCol: startChar.charCodeAt(0) - 65, // 'A'=0
        startRow
    };

    drawWarehouse();
}

// ============================================================
// TOOLTIP on hover
// ============================================================
function onCanvasMouseMove(e) {
    const rect  = canvas.getBoundingClientRect();
    const mx    = (e.clientX - rect.left) * (canvas.width  / rect.width);
    const my    = (e.clientY - rect.top)  * (canvas.height / rect.height);
    const { cols, rows, startCol, startRow } = warehouseConfig;
    const cw    = canvas.width  / cols;
    const ch    = canvas.height / rows;
    const col   = Math.floor(mx / cw);
    const row   = Math.floor(my / ch);

    if (col < 0 || col >= cols || row < 0 || row >= rows) {
        document.getElementById('canvasTooltip').style.display = 'none';
        return;
    }

    const colChar = String.fromCharCode(65 + startCol + col);
    const rowNum  = startRow + row;
    const zone    = `${colChar}${rowNum}`;

    // Find any pickers at this zone
    const here = [];
    for (const [id, pts] of Object.entries(routes)) {
        if (pts.length > 0 && pts[pts.length - 1].zone === zone) {
            here.push(pickerMeta[id]?.name || id);
        }
    }

    const tip = document.getElementById('canvasTooltip');
    tip.textContent = here.length > 0
        ? `${zone} — ${here.join(', ')}`
        : zone;

    tip.style.display = 'block';
    tip.style.left    = (e.clientX - rect.left + 12) + 'px';
    tip.style.top     = (e.clientY - rect.top  - 10) + 'px';
}

// ============================================================
// UTILS
// ============================================================
function formatTime(ts) {
    if (!ts) return '—';
    try {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch { return ts; }
}

function escHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// CSS spin for refresh icon
const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);

// ============================================================
// START
// ============================================================
window.addEventListener('DOMContentLoaded', init);
</script>
