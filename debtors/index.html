<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Debtors Control</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="dc.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="home" href="../Home/index.html" title="Home"><i class="fas fa-house"></i></a>
    <div class="brand"><div class="ttl">Fusion Debtors Control</div><div class="sub">Customer statements, who got them, and every conversation with the customer</div></div>
    <span class="sp"></span>
    <span class="hb" id="busy"></span>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on"><i class="fas fa-gauge-high"></i> Overview <span class="n" id="n-home"></span></button>
    <button data-tab="cycles"><i class="fas fa-rotate"></i> Statement cycles <span class="n" id="n-cycles"></span></button>
    <button data-tab="run"><i class="fas fa-paper-plane"></i> Send statements</button>
    <button data-tab="stmts"><i class="fas fa-file-invoice"></i> Statements sent</button>
    <button data-tab="cust"><i class="fas fa-users"></i> Customers</button>
    <button data-tab="tasks"><i class="fas fa-list-check"></i> Follow-ups <span class="n" id="n-tasks"></span></button>
    <button data-tab="setup"><i class="fas fa-gear"></i> Setup</button>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script src="dc-engine.js"></script>
<script src="dc-cycle.js"></script>
<script src="dc-store.js"></script>
<script src="dc-core.js"></script>
<script src="dc-cycles.js"></script>
<script src="dc-workbench.js"></script>
</body>
</html>
