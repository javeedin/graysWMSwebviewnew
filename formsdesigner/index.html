<html lang="en">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #0f766e;
        --primary-dark: #134e4a;
        --bg: #f4f5fa;
        --panel: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg); color: var(--text);
        height: 100vh; display: flex; flex-direction: column; overflow: hidden;

    .topbar {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));

    .layout { flex: 1; display: flex; overflow: hidden; }

    .btn-p { background: var(--primary); color: white; }
    .btn-g { background: #16a34a; color: white; }

    .lbl { display: block; font-size: 10px; font-weight: 700; color: #475569; margin-bottom: 2px; }
    .hint { font-size: 9px; color: #94a3b8; margin-top: 1px; }
    .sec { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .sec-h { padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 800; color: #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .sec-b { padding: 10px 12px; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; background: #fcfcfe; }
    .card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px 10px; }
    .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 7px 10px; }
    .mono { font-family: Consolas, monospace; font-size: 11px; }

<body>
    <div class="topbar">
        <a href="../Home/index.html" style="color:white;text-decoration:none;font-size:13px;" title="Home"><i class="fas fa-arrow-left"></i></a>
        <div class="title"><i class="fas fa-object-group"></i> Forms Designer</div>
        <div class="ver">v9.0.1</div>

<script src="form-engine.js"></script>
<script src="visual-designer.js"></script>
<script>
// ── WebView bridge ──────────────────────────────────────────
window.pendingRequests = window.pendingRequests || {};
function generateRequestId() { return 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function sendMessageToCSharp(message, callback) {
    if (!(window.chrome && window.chrome.webview)) {
        if (callback) callback('WebView2 bridge not available (open this page inside the WMS app)', null);
        return;
    }
    const requestId = generateRequestId();
    message.requestId = requestId;
    if (callback) window.pendingRequests[requestId] = callback;
    window.chrome.webview.postMessage(message);
}
if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (event) {
        const r = event.data;
        if (!r || !r.requestId) return;
        const cb = window.pendingRequests[r.requestId];
        if (!cb) return;
        delete window.pendingRequests[r.requestId];
        if (r.action === 'error') { cb(r.message || 'Unknown error', null); }
        else if (r.action === 'restResponse') {
            if (r.success === false) cb('HTTP ' + r.statusCode, null);
            else cb(null, r.data);
        }
        else cb(null, r);
    });
    // live status while the AI designs a form (no requestId on these)
    window.chrome.webview.addEventListener('message', function (event) {
        const r = event.data;
        if (r && r.action === 'aiChatEvent') baiEvent(r);
    });
}

const AI_BASE = 'https://g09254cbbf8e7af-graysprod.adb.eu-frankfurt-1.oraclecloudapps.com/ords/WKSP_GRAYSAPP/WAREHOUSEMANAGEMENT/ai';
function appUserName() { try { return localStorage.getItem('wms_user') || 'DESIGNER'; } catch (e) { return 'DESIGNER'; } }
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function runQuery(sql, cb) {
    sendMessageToCSharp({ action: 'executePost', fullUrl: AI_BASE + '/executequery', body: JSON.stringify({ sql: sql, maxRows: 300, appUser: appUserName() }) }, function (err, data) {
        if (err) { cb(String(err), null); return; }
        try {
            const r = typeof data === 'string' ? JSON.parse(data) : data;
            if (!r.success) { cb(r.error || 'query failed', null); return; }
            const cols = r.columns || [];
            cb(null, (r.rows || []).map(row => { const o = {}; cols.forEach((c, i) => o[String(c).toUpperCase()] = row[i]); return o; }));
        } catch (e) { cb(e.message, null); }
    });
}
function runWrite(sql, cb) {
    sendMessageToCSharp({ action: 'executePost', fullUrl: AI_BASE + '/executewrite', body: JSON.stringify({ sql: sql, appUser: appUserName() }) }, function (err, data) {
        let d = null;
        try { d = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { }
        if (err || !d || d.success !== true) { cb(String(err || (d && d.error) || 'unknown'), null); return; }
        cb(null, d);
    });
}
function sqlq(s) { return "'" + String(s === undefined || s === null ? '' : s).replace(/'/g, "''") + "'"; }
// Oracle SQL string literals are capped at 4000 chars, but a form
// definition can be much larger. Emit it as TO_CLOB('..')||TO_CLOB('..')
// with every literal kept under 3800 chars (after quote-escaping) so
// large definitions save through the write gateway without ORA-01704.
function clobLiteral(s) {
    s = String(s === undefined || s === null ? '' : s);
    const MAX = 3800, parts = [];
    let cur = '';
    for (let i = 0; i < s.length; i++) {
        const piece = s[i] === "'" ? "''" : s[i];
        if (cur.length + piece.length > MAX) { parts.push(cur); cur = ''; }
        cur += piece;
    }
    if (cur.length) parts.push(cur);
    if (!parts.length) return "TO_CLOB('')";
    return parts.map(p => "TO_CLOB('" + p + "')").join(' || ');
}

// ── state ───────────────────────────────────────────────────
let formRows = [];        // rows from wms_ai_forms
let curKey = null;        // selected form_key ('' = new)
let cur = null;           // { form_key, name, description, active, def }
let jsonMode = false;

const EMPTY_DEF = () => ({
    title: 'New Form', icon: 'wpforms', width: 950,
    header: { columns: 4, fields: [] },
    details: [],
    reports: [],
    rules: { submitChecks: [] },
    mobile: { columns: 1, hidden: [], order: [] },
    sections: [],
    regions: [],
    style: {},
    actions: [ { key: 'close', label: 'Close', type: 'close', style: 'default' } ]
});
let pageTab = 'design';   // 'chat' | 'design' | 'visual' | 'test'
let chatMsgs = [];        // conversational builder history [{role:'user'|'ai', text, summary}]
let chatImgs = [];        // pending screenshots for the chat builder
let chatBusy = false;

function normalizeLoadedDef(def) {
    def.header = def.header || { columns: 4, fields: [] };
    def.header.fields = def.header.fields || [];
    def.details = def.details || [];
    def.reports = def.reports || [];
    def.rules = def.rules || {};
    def.rules.submitChecks = def.rules.submitChecks || [];
    def.actions = def.actions || [];
    def.mobile = def.mobile || { columns: 1, hidden: [], order: [] };
    def.sections = def.sections || [];
    def.sections.forEach(s => { s.style = s.style || {}; });
    def.regions = def.regions || [];
    def.style = def.style || {};
    return def;
}

// ── forms list ──────────────────────────────────────────────
function loadForms() {
    runQuery("SELECT form_key, name, description, active FROM wms_ai_forms ORDER BY name", function (err, rows) {
        const box = document.getElementById('form-list');
        if (err) {
            box.innerHTML = '<div style="font-size:11px;color:#b91c1c;">' + esc(err) + '<br><br>Has apex_sql/49_ai_forms.sql been run?</div>';
            return;
        }
        formRows = rows.map(r => ({ form_key: String(r.FORM_KEY || ''), name: String(r.NAME || ''), description: r.DESCRIPTION || '', active: String(r.ACTIVE || 'Y') }));
        renderList();
    });
}
function renderList() {
    const box = document.getElementById('form-list');
    if (!formRows.length) { box.innerHTML = '<div style="font-size:11px;color:#94a3b8;">No forms yet — click New.</div>'; return; }
    box.innerHTML = formRows.map(f => `
        <div style="border:1px solid ${curKey === f.form_key ? '#99f6e4' : 'var(--border)'};background:${curKey === f.form_key ? '#f0fdfa' : 'white'};border-radius:8px;padding:8px 10px;margin-bottom:5px;${f.active !== 'Y' ? 'opacity:0.55;' : ''}display:flex;align-items:center;gap:8px;">
            <div onclick="openForm('${esc(f.form_key)}')" style="flex:1;min-width:0;cursor:pointer;">
                <div style="font-size:11.5px;font-weight:700;color:#0f172a;">${esc(f.name)} ${f.active !== 'Y' ? '<span style="font-size:8.5px;color:#b91c1c;font-weight:700;">INACTIVE</span>' : ''}</div>
                <div style="font-size:9.5px;color:#94a3b8;margin-top:2px;">${esc(f.form_key)}</div>
            </div>
            <button onclick="event.stopPropagation();deleteForm('${esc(f.form_key)}','${esc((f.name || '').replace(/'/g, ""))}')" title="Delete this form" style="border:none;background:#fef2f2;color:#dc2626;border-radius:7px;width:26px;height:26px;cursor:pointer;flex:0 0 auto;"><i class="fas fa-trash"></i></button>
        </div>`).join('');
}
// Show what the DB actually holds: stored definition length per form, and
// whether the read gateway returns that CLOB in full. Pinpoints write vs read.
function dbCheck() {
    const old = document.getElementById('dbc-modal'); if (old) old.remove();
    document.body.insertAdjacentHTML('beforeend',
    '<div id="dbc-modal" style="position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:30000;display:flex;align-items:center;justify-content:center;padding:20px;">' +
      '<div style="background:white;width:96%;max-width:640px;max-height:88vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.35);">' +
        '<div style="padding:0.8rem 1.2rem;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-weight:800;font-size:14px;color:white;"><i class="fas fa-database"></i> What is stored in the DB</div>' +
          '<button onclick="document.getElementById(\'dbc-modal\').remove()" style="background:none;border:none;color:white;font-size:1.3rem;cursor:pointer;">&times;</button>' +
        '</div>' +
        '<div id="dbc-body" style="padding:1rem 1.2rem;overflow:auto;font-size:12px;">Checking…</div>' +
      '</div></div>');
    runQuery("SELECT form_key, LENGTH(definition) AS DEFLEN, LENGTH(definition) AS READLEN FROM wms_ai_forms ORDER BY form_key", function (err, rows) {
        const b = document.getElementById('dbc-body'); if (!b) return;
        if (err) { b.innerHTML = '<span style="color:#b91c1c;">' + esc(err) + '</span>'; return; }
        if (!rows.length) { b.innerHTML = 'No forms in wms_ai_forms.'; return; }
        // DEFLEN is server-side LENGTH; READLEN comes back the same only if the
        // read gateway returns CLOBs. We also re-read the actual CLOB per row.
        let done = 0;
        const info = rows.map(r => ({ key: String(r.FORM_KEY), stored: Number(r.DEFLEN) || 0, got: null }));
        info.forEach(row => {
            runQuery("SELECT definition FROM wms_ai_forms WHERE form_key = " + sqlq(row.key), function (e2, rr) {
                row.got = (!e2 && rr && rr[0] && rr[0].DEFINITION != null) ? String(rr[0].DEFINITION).length : 0;
                if (++done === info.length) render();
            });
        });
        function render() {
            b.innerHTML =
                '<div style="color:#64748b;margin-bottom:8px;">Stored = true size (server LENGTH). Returned = what the read gateway actually sends back. If Stored &gt; 0 but Returned = 0, <b>apex_sql/35d is not active</b>.</div>' +
                '<table style="width:100%;border-collapse:collapse;">' +
                '<tr style="background:#f8fafc;"><th style="text-align:left;padding:6px;">Form</th><th style="text-align:right;padding:6px;">Stored</th><th style="text-align:right;padding:6px;">Returned</th><th style="padding:6px;">Status</th></tr>' +
                info.map(r => {
                    const ok = r.stored > 0 && r.got >= r.stored * 0.98;
                    const readBad = r.stored > 0 && r.got < r.stored * 0.98;
                    const badge = r.stored === 0 ? '<span style="color:#b91c1c;font-weight:700;">empty (write)</span>'
                        : readBad ? '<span style="color:#b45309;font-weight:700;">read truncated → 35d</span>'
                        : '<span style="color:#15803d;font-weight:700;">OK</span>';
                    return '<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:6px;">' + esc(r.key) + '</td>' +
                        '<td style="text-align:right;padding:6px;">' + r.stored + '</td>' +
                        '<td style="text-align:right;padding:6px;">' + r.got + '</td>' +
                        '<td style="padding:6px;">' + badge + '</td></tr>';
                }).join('') + '</table>';
        }
    });
}
function deleteForm(key, name) {
    if (!key) return;
    if (!confirm('Delete the form "' + (name || key) + '" (' + key + ')?\n\nThis permanently removes it from the database and cannot be undone.')) return;
    runWrite('DELETE FROM wms_ai_forms WHERE form_key = ' + sqlq(key), function (err, d) {
        if (err) { alert('Delete failed: ' + err); return; }
        if (curKey === key) { cur = null; curKey = ''; const ed = document.getElementById('editor'); if (ed) ed.innerHTML = '<div style="font-size:11px;color:#94a3b8;padding:2rem;text-align:center;">Form deleted. Select another or create a new one.</div>'; }
        loadForms();
    });
}
function openForm(key) {
    runQuery("SELECT form_key, name, description, active, definition, LENGTH(definition) AS DEFLEN FROM wms_ai_forms WHERE form_key = " + sqlq(key), function (err, rows) {
        if (err || !rows.length) { alert('Could not load form: ' + (err || 'not found')); return; }
        const r = rows[0];
        let def = null, warn = '';
        const raw = r.DEFINITION;
        const deflen = Number(r.DEFLEN) || 0;   // true stored size (server-side, unaffected by CLOB read)
        if (raw == null || String(raw).trim() === '' || String(raw).trim() === 'null') {
            if (deflen > 0) {
                // The row HAS a definition of `deflen` chars, but the CLOB came
                // back empty -> the READ gateway is not returning CLOBs. 35d is
                // not active on this workspace (or the app hit an older handler).
                warn = 'READ-GATEWAY ISSUE: the definition IS stored (' + deflen + ' chars) but came back empty, so apex_sql/35d is NOT active on the workspace the app uses. Re-run 35d there (verify STATUS=VALID) and confirm the ai/executequery handler calls wms_ai_execute_query. The form is safe — just not readable yet.';
            } else {
                warn = 'WRITE ISSUE: this form has NO stored definition (length 0) — the save did not persist. Delete it, then Import the JSON and Save, and read the green "verified — N chars" line.';
            }
        } else {
            try { def = JSON.parse(raw); } catch (e) { warn = 'Stored definition did not fully parse (got ' + String(raw).length + ' of ' + deflen + ' chars). If those differ, the read is truncating — re-run apex_sql/35d.'; }
        }
        // unwrap an envelope { form_key, name, definition:{...} } if one was stored by mistake
        if (def && !def.header && def.definition && def.definition.header) def = def.definition;
        if (!def || typeof def !== 'object' || !def.header) { if (!warn) warn = 'Stored definition is unusable — starting from an empty layout.'; def = EMPTY_DEF(); }
        if (warn) alert(warn);
        normalizeLoadedDef(def);
        cur = { form_key: String(r.FORM_KEY), name: String(r.NAME || ''), description: String(r.DESCRIPTION || ''), active: String(r.ACTIVE || 'Y'), def: def, isNew: false };
        curKey = cur.form_key;
        jsonMode = false;
        pageTab = 'design';
        resetTestPreview();
        renderList(); renderEditor();
    });
}
// ── New Form wizard: pick a type, start from a seeded template ──
const FORM_TYPES = [
    { key: 'blank', icon: 'file', name: 'Blank Form', desc: 'Completely empty — design everything yourself in the Visual tab.' },
    { key: 'single', icon: 'file-lines', name: 'Single Form', desc: 'Header-only entry form — settings, requests, notes.' },
    { key: 'master', icon: 'table-list', name: 'Master–Detail', desc: 'Header plus one or more grids with totals — orders, returns.' },
    { key: 'interactive', icon: 'magnifying-glass-chart', name: 'Interactive Report', desc: 'Filter fields on top, a live report grid below, print.' },
    { key: 'wizard', icon: 'stairs', name: 'Wizard', desc: 'Multi-step: tab pages become steps with Back / Next.' },
    { key: 'report', icon: 'print', name: 'Report Page', desc: 'No entry — parameters and one or more printable reports.' }
];
function formTemplate(type) {
    const base = EMPTY_DEF();
    if (type === 'single') {
        base.title = 'New Single Form';
        base.header.fields = [
            { key: 'entry_date', label: 'Date', type: 'date', default: '$TODAY', required: true },
            { key: 'reference', label: 'Reference', type: 'text' },
            { key: 'notes', label: 'Notes', type: 'textarea', span: 4 }
        ];
        base.actions.unshift({ key: 'save_local', label: 'Save Local', icon: 'floppy-disk', style: 'primary', type: 'local_file', validate: true, folder: 'forms' });
    } else if (type === 'master') {
        base.title = 'New Master-Detail Form';
        base.header.fields = [
            { key: 'doc_date', label: 'Date', type: 'date', default: '$TODAY', required: true },
            { key: 'reference', label: 'Reference', type: 'text' }
        ];
        base.details = [{
            key: 'lines', title: 'Lines', allowManualRow: true, allowDelete: true, qtyKey: 'qty', required: true,
            columns: [
                { key: 'item', label: 'Item', type: 'text', editable: true, width: 140 },
                { key: 'description', label: 'Description', type: 'text', editable: true, width: 220 },
                { key: 'qty', label: 'Qty', type: 'number', editable: true, default: 1, width: 70 },
                { key: 'price', label: 'Price', type: 'number', editable: true, width: 90 },
                { key: 'amount', label: 'Amount', type: 'computed', formula: 'qty * price' }
            ],
            totals: ['qty', 'amount']
        }];
        base.actions.unshift({ key: 'save_local', label: 'Save Local', icon: 'floppy-disk', style: 'primary', type: 'local_file', validate: true, folder: 'forms' });
    } else if (type === 'interactive') {
        base.title = 'New Interactive Report';
        base.header.fields = [
            { key: 'from_date', label: 'From', type: 'date', default: '$TODAY' },
            { key: 'to_date', label: 'To', type: 'date', default: '$TODAY' },
            { key: 'search', label: 'Search', type: 'text', span: 2 }
        ];
        base.reports = [{ key: 'results', title: 'Results', sql: '', autoRun: false }];
        base.actions.unshift({ key: 'print', label: 'Print', icon: 'print', style: 'primary', type: 'print' });
    } else if (type === 'wizard') {
        base.title = 'New Wizard';
        base.wizard = true;
        base.header.fields = [
            { key: 'w_date', label: 'Date', type: 'date', default: '$TODAY', required: true, tab: 'Step 1 - Basics' },
            { key: 'w_ref', label: 'Reference', type: 'text', tab: 'Step 1 - Basics' },
            { key: 'w_detail1', label: 'Detail A', type: 'text', tab: 'Step 2 - Details' },
            { key: 'w_detail2', label: 'Detail B', type: 'text', tab: 'Step 2 - Details' },
            { key: 'w_confirm', label: 'Remarks', type: 'textarea', span: 4, tab: 'Step 3 - Confirm' }
        ];
        base.actions.unshift({ key: 'save_local', label: 'Finish & Save', icon: 'flag-checkered', style: 'primary', type: 'local_file', validate: true, folder: 'forms' });
    } else if (type === 'report') {
        base.title = 'New Report Page';
        base.header.fields = [
            { key: 'p_from', label: 'From', type: 'date', default: '$TODAY' },

function doImportJson() {

    const status = document.getElementById('imp-status');
    if (!raw.trim()) { if (status) status.innerHTML = '<span style="color:#b91c1c;">Paste the JSON first.</span>'; return; }
    let env;
    try { env = JSON.parse(raw); } catch (e) { if (status) status.innerHTML = '<span style="color:#b91c1c;">Invalid JSON: ' + esc(e.message) + '</span>'; return; }
    const def = env.definition || (env.header ? env : null);
    if (!def || !def.header) { if (status) status.innerHTML = '<span style="color:#b91c1c;">No usable definition found (it needs a "header").</span>'; return; }
    cur = {
        form_key: String(env.form_key || ''), name: String(env.name || def.title || 'Imported form'),
        description: String(env.description || ''), active: 'Y',
        def: normalizeLoadedDef(def), isNew: true
    };
    curKey = ''; jsonMode = false;
    chatMsgs = [{ role: 'ai', summary: 'Imported from JSON — the preview is live. Refine by chatting, tweak in Designer/Visual, then set a form key and Save.' }];
    const m = document.getElementById('imp-modal'); if (m) m.remove();
    pageTab = 'chat';
    resetTestPreview();
    renderList(); renderEditor();

// ── generic binding: data-p="path.into.def" ────────────────
function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o === undefined || o === null) ? undefined : o[isNaN(k) ? k : Number(k)], obj);
}
function setPath(obj, path, val) {
    const parts = path.split('.');
    let o = obj;
    for (let i = 0; i < parts.length - 1; i++) o = o[isNaN(parts[i]) ? parts[i] : Number(parts[i])];
    o[isNaN(parts.at(-1)) ? parts.at(-1) : Number(parts.at(-1))] = val;
}
function bindInputs() {
    document.querySelectorAll('#editor [data-p]').forEach(el => {
        el.addEventListener('change', function () {
            const path = el.getAttribute('data-p');
            const kind = el.getAttribute('data-kind') || 'text';
            let v;
            if (kind === 'bool') v = el.checked;
            else if (kind === 'num') v = el.value === '' ? undefined : Number(el.value);
            else if (kind === 'json') {
                if (!el.value.trim()) { v = undefined; el.classList.remove('json-bad'); }
                else {
                    try { v = JSON.parse(el.value); el.classList.remove('json-bad'); }
                    catch (e) { el.classList.add('json-bad'); return; }
                }
            }
            else v = el.value;
            setPath(cur, path, v);
        });
    });
}

// Run the section's Source SQL and create a field per result column
// (APEX form-on-table style). Placeholders are bound to '' for the probe.
function generateSectionFields(i) {
    const s = cur.def.sections[i];
    if (!s || !s.sourceSql || !s.sourceSql.trim()) { alert('Enter the Source SQL first.'); return; }
    let sql = String(s.sourceSql).replace(/:[A-Za-z_]\w*/g, "''");
    sql = 'SELECT * FROM (' + sql.replace(/;\s*$/, '') + ') WHERE ROWNUM <= 1';
    runQuery(sql, function (err, rows) {
        if (err) { alert('Could not probe the SQL:\n' + err); return; }
        const sample = rows[0] || null;
        let cols = sample ? Object.keys(sample) : [];
        if (!cols.length) { alert('The query returned no columns to generate from (0 rows and no metadata). Add sample data or check the SQL.'); return; }
        const existing = cur.def.header.fields.map(f => f.key);
        let added = 0;
        cols.forEach(cn => {
            const key = cn.toLowerCase();
            if (existing.indexOf(key) >= 0) return;
            const v = sample ? sample[cn] : null;
            let type = 'text';
            if (typeof v === 'number') type = 'number';
            else if (/(^|_)(date|_on)$/i.test(cn) || /^\d{4}-\d{2}-\d{2}/.test(String(v || ''))) type = 'date';
            cur.def.header.fields.push({
                key: key,
                label: cn.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase()),
                type: type, section: s.key
            });
            added++;
        });
        renderEditor();
        alert(added + ' field(s) generated into section "' + (s.title || s.key) + '". Adjust types/labels as needed.');
    });
}

// Generate a region's artifacts from its Source SQL: single-row ->
// fields joined to the region; multi-row -> a detail grid with columns
function generateRegion(i) {
    const r = cur.def.regions[i];
    if (!r || !r.sourceSql || !r.sourceSql.trim()) { alert('Enter the Source SQL first.'); return; }
    let sql = String(r.sourceSql).replace(/:[A-Za-z_]\w*/g, "''");
    sql = 'SELECT * FROM (' + sql.replace(/;\s*$/, '') + ') WHERE ROWNUM <= 1';
    runQuery(sql, function (err, rows) {
        if (err) { alert('Could not probe the SQL:\n' + err); return; }
        const sample = rows[0] || null;
        const cols = sample ? Object.keys(sample) : [];
        if (!cols.length) { alert('The query returned no columns to generate from. Check the SQL (or add sample data).'); return; }
        const label = cn => cn.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase());
        const guessType = (cn, v) => typeof v === 'number' ? 'number'
            : (/(^|_)(date|_on)$/i.test(cn) || /^\d{4}-\d{2}-\d{2}/.test(String(v || ''))) ? 'date' : 'text';
        let added = 0;
        if (r.display === 'multi') {
            let det = (cur.def.details || []).find(dd => dd.region === r.key);
            if (!det) {
                det = { key: r.key + '_grid', title: r.title || r.key, region: r.key, allowManualRow: true, allowDelete: true, qtyKey: 'qty', columns: [], totals: [] };
                (cur.def.details = cur.def.details || []).push(det);
            }
            det.sourceSql = r.sourceSql;
            const existing = (det.columns || []).map(c => c.key);
            cols.forEach(cn => {
                const key = cn.toLowerCase();
                if (existing.indexOf(key) >= 0) return;
                det.columns.push({ key: key, label: label(cn), type: (sample && typeof sample[cn] === 'number') ? 'number' : 'text', editable: true });
                added++;
            });
            alert(added + ' column(s) generated into the "' + (det.title || det.key) + '" grid (rows load from the SQL on open).');
        } else {
            const existing = cur.def.header.fields.map(f => f.key);
            cols.forEach(cn => {
                const key = cn.toLowerCase();
                if (existing.indexOf(key) >= 0) return;
                cur.def.header.fields.push({ key: key, label: label(cn), type: guessType(cn, sample ? sample[cn] : null), region: r.key });
                added++;
            });
            alert(added + ' field(s) generated into region "' + (r.title || r.key) + '". Turn on Fetch on open to load the record.');
        }
        renderEditor();
    });
}

// ── save ────────────────────────────────────────────────────
function saveForm() {
    normalizeDef();
    const status = document.getElementById('save-status');
    const key = (cur.isNew ? (document.querySelector('[data-p="form_key"]') || {}).value || cur.form_key : cur.form_key).trim();
    if (!key || !/^[A-Za-z0-9._\-]{2,100}$/.test(key)) { status.innerHTML = '<span style="color:#b91c1c;">Form key is required (letters, digits, dots).</span>'; return; }
    if (!cur.name.trim()) { status.innerHTML = '<span style="color:#b91c1c;">Name is required.</span>'; return; }
    const defJson = JSON.stringify(cur.def);
    const expected = defJson.length;

    // Robust CLOB save: write the row with an EMPTY_CLOB, then APPEND the
    // definition in small chunks (each its own single-statement UPDATE).
    // No statement is ever large, so nothing about literal/statement size
    // can cause a partial or empty write.
    const CH = 3000, chunks = [];
    for (let i = 0; i < defJson.length; i += CH) chunks.push(defJson.slice(i, i + CH));
    const esc1 = s => s.replace(/'/g, "''");
    const stmts = [];
    if (cur.isNew) {
        stmts.push('INSERT INTO wms_ai_forms (form_key, name, description, definition, active, updated_by, updated_on) VALUES (' +
            [sqlq(key), sqlq(cur.name), sqlq(cur.description), 'EMPTY_CLOB()', sqlq(cur.active), sqlq(appUserName()), 'SYSDATE'].join(', ') + ')');
    } else {
        stmts.push('UPDATE wms_ai_forms SET name = ' + sqlq(cur.name) + ', description = ' + sqlq(cur.description) +
            ', definition = EMPTY_CLOB(), active = ' + sqlq(cur.active) +
            ', updated_by = ' + sqlq(appUserName()) + ', updated_on = SYSDATE WHERE form_key = ' + sqlq(key));
    }
    chunks.forEach(c => stmts.push("UPDATE wms_ai_forms SET definition = definition || TO_CLOB('" + esc1(c) + "') WHERE form_key = " + sqlq(key)));

    let idx = 0;
    status.innerHTML = '<span style="color:#0e7490;"><i class="fas fa-spinner fa-spin"></i> Saving (' + stmts.length + ' parts)…</span>';
    (function next() {
        if (idx >= stmts.length) { afterSave(); return; }
        runWrite(stmts[idx], function (err) {
            if (err) {
                const hint = (idx === 0 && cur.isNew && /unique|00001/i.test(String(err)))
                    ? ' — a form with key "' + key + '" already exists. Delete it (trash icon) or open it to update.' : '';
                status.innerHTML = '<span style="color:#b91c1c;">Save failed at part ' + (idx + 1) + '/' + stmts.length + ': ' + esc(err) + hint + '</span>';
                return;
            }
            idx++; status.innerHTML = '<span style="color:#0e7490;"><i class="fas fa-spinner fa-spin"></i> Saving part ' + idx + '/' + stmts.length + '…</span>';
            next();
        });
    })();

    function afterSave() {
        cur.form_key = key; cur.isNew = false; curKey = key;
        loadForms();
        runQuery("SELECT LENGTH(definition) AS LEN FROM wms_ai_forms WHERE form_key = " + sqlq(key), function (e2, rows) {
            const stored = (rows && rows[0] && Number(rows[0].LEN)) || 0;
            if (e2) {
                status.innerHTML = '<span style="color:#15803d;"><i class="fas fa-check-circle"></i> Saved.</span> <span style="color:#94a3b8;">(could not verify: ' + esc(e2) + ')</span>';
            } else if (stored >= expected * 0.98) {
                status.innerHTML = '<span style="color:#15803d;"><i class="fas fa-check-circle"></i> Saved &amp; verified — ' + stored + ' chars stored in full. The AI chat and all pages see it immediately.</span>';
            } else {
                status.innerHTML = '<span style="color:#b45309;font-weight:700;"><i class="fas fa-triangle-exclamation"></i> Saved, but stored ' + stored + ' of ' + expected + ' chars — tell me and I\'ll dig in.</span>';
            }
        });
    }
}

let _sqlTestPath = null;
function openSqlTester(path) {

          (phs.length
            ? '<div style="font-size:10px;font-weight:700;color:#475569;margin:8px 0 4px;">SAMPLE VALUES FOR PLACEHOLDERS</div>' +
              '<div class="grid3">' + phs.map((p, i) =>
                fld(esc(p), '<input type="text" class="in sqltest-ph" data-ph="' + esc(p) + '" placeholder="' + (p === ':SEARCH' ? 'search text (empty = match all)' : 'sample value') + '">')).join('') + '</div>'
            : '<div style="font-size:10px;color:#94a3b8;margin-top:6px;">No placeholders detected — runs as-is.</div>') +
          '<div style="margin:10px 0 6px;display:flex;gap:8px;align-items:center;">' +
            '<button class="btn btn-p" onclick="sqlTestRun()"><i class="fas fa-play"></i> Run (max 50 rows)</button>' +
            '<span id="sqltest-status" style="font-size:11px;"></span>' +
          '</div>' +
          '<div id="sqltest-res"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
    document.body.insertAdjacentHTML('beforeend', html);
    const first = document.querySelector('#sqltest-modal .sqltest-ph');
    if (first) setTimeout(() => first.focus(), 60);
}
function sqlTestRun() {
    let sql = String(getPath(cur, _sqlTestPath) || '');
    const status = document.getElementById('sqltest-status');
    const res = document.getElementById('sqltest-res');
    document.querySelectorAll('#sqltest-modal .sqltest-ph').forEach(inp => {
        const ph = inp.getAttribute('data-ph');
        const v = inp.value;
        const lit = ph === ':SEARCH'
            ? "'%" + String(v).replace(/'/g, "''").toUpperCase() + "%'"
            : "'" + String(v).replace(/'/g, "''") + "'";
        sql = sql.replace(new RegExp(ph.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g'), lit);
    });
    status.innerHTML = '<span style="color:#0e7490;"><i class="fas fa-spinner fa-spin"></i> Running…</span>';
    res.innerHTML = '';
    runQuery(sql.replace(/;\s*$/, ''), function (err, rows) {
        if (err) {
            status.innerHTML = '<span style="color:#b91c1c;font-weight:700;">Error</span>';
            res.innerHTML = '<div style="font-size:11px;color:#b91c1c;background:#fff7f7;border:1px solid #fca5a5;border-radius:7px;padding:8px;">' + esc(err) + '</div>' +
                '<details style="margin-top:6px;"><summary style="font-size:9.5px;color:#94a3b8;cursor:pointer;">SQL that ran</summary><pre class="mono" style="font-size:10px;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:6px;white-space:pre-wrap;word-break:break-all;">' + esc(sql) + '</pre></details>';
            return;
        }
        const shown = rows.slice(0, 50);
        status.innerHTML = '<span style="color:#15803d;font-weight:700;"><i class="fas fa-check-circle"></i> ' + rows.length + ' row(s)</span>';
        if (!shown.length) { res.innerHTML = '<div style="font-size:11px;color:#94a3b8;padding:8px;">Query ran fine but returned no rows — check the sample values.</div>'; }
        else {
            const cols = Object.keys(shown[0]);
            res.innerHTML = '<div style="border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:280px;">' +
                '<table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr style="background:#f8fafc;position:sticky;top:0;">' +
                cols.map(c => '<th style="padding:5px 7px;text-align:left;">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
                shown.map(r => '<tr style="border-bottom:1px solid #f1f5f9;">' + cols.map(c => '<td style="padding:4px 7px;">' + esc(r[c]) + '</td>').join('') + '</tr>').join('') +
                '</tbody></table></div>';
        }
        res.innerHTML += '<details style="margin-top:6px;"><summary style="font-size:9.5px;color:#94a3b8;cursor:pointer;">SQL that ran</summary><pre class="mono" style="font-size:10px;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:6px;white-space:pre-wrap;word-break:break-all;">' + esc(sql) + '</pre></details>';
    });
}

function baiFiles(files) { for (const f of files) baiAddFile(f); }
function baiAddFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
        const b64 = String(reader.result).split(',')[1] || '';
        baiImgs.push({ name: file.name || ('pasted_' + Date.now() + '.png'), b64: b64 });
        renderBaiChips();
    };
    reader.readAsDataURL(file);
}
function renderBaiChips() {
    const box = document.getElementById('bai-chips');
    if (!box) return;
    box.innerHTML = baiImgs.map((f, i) =>
        '<span style="font-size:10px;background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:8px;font-weight:700;">' +
        '<i class="fas fa-image"></i> ' + esc(f.name) + ' <i class="fas fa-times" style="cursor:pointer;" onclick="baiImgs.splice(' + i + ',1);renderBaiChips()"></i></span>').join('');
}
function baiEvent(evt) {
    const s = document.getElementById('bai-status');
    if (!s) return;
    if (evt.eventType === 'status') s.textContent = evt.text || '';
    else if (evt.eventType === 'sqlRound') s.textContent = 'AI is checking the schema/data (round ' + (evt.round || '') + ')…';
}
function baiSetBusy(b) {
    const go = document.getElementById('bai-go');
    if (go) { go.disabled = b; go.innerHTML = b ? '<i class="fas fa-spinner fa-spin"></i> Designing…' : '<i class="fas fa-wand-magic-sparkles"></i> Build the form'; }
}
function baiBuild() {
    const desc = (document.getElementById('bai-desc') || {}).value.trim();
    const status = document.getElementById('bai-status');
    if (!desc && !baiImgs.length) { status.innerHTML = '<span style="color:#b91c1c;">Describe the form or attach a screenshot first.</span>'; return; }
    baiSetBusy(true);

    // 1) upload screenshots into the AI workspace
    const paths = [];
    const queue = baiImgs.slice();
    (function uploadNext() {
        if (queue.length) {
            status.textContent = 'Uploading screenshot ' + (paths.length + 1) + ' of ' + baiImgs.length + '…';
            const f = queue.shift();
            sendMessageToCSharp({ action: 'aiSaveAttachment', fileName: f.name, dataBase64: f.b64 }, function (err, d) {
                if (err || !d || d.success === false) { baiSetBusy(false); status.innerHTML = '<span style="color:#b91c1c;">Screenshot upload failed: ' + esc(String(err || (d && d.error) || '')) + '</span>'; return; }
                paths.push(d.path);
                uploadNext();
            });
            return;
        }
        // 2) ask the AI to design the definition
        status.textContent = 'Asking the AI to design the form… this can take a minute.';
        const prompt =
            'BUILD FORM DEFINITION REQUEST\n\n' +
            'The user described the form they want built in the Forms Designer:\n"""\n' + (desc || '(no text - design from the screenshot)') + '\n"""\n' +
            (paths.length
                ? 'Sample screenshot(s) of the desired form are saved at:\n' + paths.map(p => '- ' + p).join('\n') +
                  '\nREAD each image with your Read tool and reproduce its layout: sections and tab pages, field labels and order, grids with their columns, totals and buttons.\n'
                : '') +
            'Design the COMPLETE form definition JSON per the USER-DEFINED FORMS schema in your instructions (header fields with lists/pickers, detail grids, reports, rules.submitChecks, actions). ' +
            'Verify every table and column you reference against the schema catalog; use the KNOWN DATA LOCATIONS (customers = GRFU_CUSTOMER). ' +
            'Reply with action answer whose markdown contains EXACTLY ONE fenced code block: ```json { "form_key": "...", "name": "...", "description": "...", "definition": { ... } } ``` ' +
            'Do NOT open any form and do NOT write to the database - the Forms Designer loads your JSON for the user to review, test and save.';
        sendMessageToCSharp({ action: 'aiChatSend', text: '[CURRENT_INSTANCE: PROD]\n' + prompt, sessionId: null, instance: 'PROD' }, function (err, resp) {
            baiSetBusy(false);
            if (err) { status.innerHTML = '<span style="color:#b91c1c;">AI request failed: ' + esc(String(err)) + '</span>'; return; }
            if (resp && resp.requiresApproval) { status.innerHTML = '<span style="color:#b91c1c;">The AI tried to execute a write instead of replying with the design — please try again.</span>'; return; }
            const md = (resp && (resp.markdown || resp.answer)) || '';
            const m = md.match(/```json\s*([\s\S]*?)```/i) || md.match(/```\s*(\{[\s\S]*?\})\s*```/);
            if (!m) { status.innerHTML = '<span style="color:#b91c1c;">Could not find the definition JSON in the AI reply. Reply was: ' + esc(md.slice(0, 220)) + '…</span>'; return; }
            let env;
            try { env = JSON.parse(m[1]); } catch (e) { status.innerHTML = '<span style="color:#b91c1c;">AI returned invalid JSON: ' + esc(e.message) + '</span>'; return; }
            const def = env.definition || (env.header ? env : null);
            if (!def || !def.header) { status.innerHTML = '<span style="color:#b91c1c;">AI reply had no usable definition.</span>'; return; }
            normalizeLoadedDef(def);
            cur = {
                form_key: String(env.form_key || 'form.' + Date.now()),
                name: String(env.name || def.title || 'AI Form'),
                description: String(env.description || ''),
                active: 'Y', def: def, isNew: true
            };
            curKey = '';
            const modal = document.getElementById('bai-modal');
            if (modal) modal.remove();
            jsonMode = false;
            resetTestPreview();
            pageTab = 'test';   // land straight on the live preview
            renderList(); renderEditor();
            const ss = document.getElementById('save-status');
            if (ss) ss.innerHTML = '<span style="color:#6d28d9;font-weight:700;"><i class="fas fa-wand-magic-sparkles"></i> AI draft loaded — test it here, adjust in the Designer tab, then Save.</span>';
        });
    })();
}

// ── Conversational builder (AI Build tab) ───────────────────
// Start a fresh blank form in chat mode and greet the user.
function newChatForm() {
    cur = { form_key: '', name: '', description: '', active: 'Y', def: formTemplate('blank'), isNew: true };
    curKey = ''; jsonMode = false; chatImgs = [];
    chatMsgs = [{ role: 'ai', summary: 'Hi! Describe the form you need — the fields, where data comes from (tables / APIs), any validations, and the buttons. I\'ll build it and you\'ll see it live on the right. Then just keep chatting to refine it.' }];
    pageTab = 'chat';
    resetTestPreview();
    renderList(); renderEditor();
}
function chatFiles(files) { for (const f of files) chatAddFile(f); }
function chatAddFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
        chatImgs.push({ name: file.name || ('pasted_' + Date.now() + '.png'), b64: String(reader.result).split(',')[1] || '' });
        renderChatImgs();
    };
    reader.readAsDataURL(file);
}
function renderChatImgs() {
    const box = document.getElementById('chat-imgs');
    if (!box) return;
    box.innerHTML = chatImgs.map((f, i) =>
        '<span style="font-size:10px;background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:8px;font-weight:700;margin:4px 0;">' +
        '<i class="fas fa-image"></i> ' + esc(f.name) + ' <i class="fas fa-times" style="cursor:pointer;" onclick="chatImgs.splice(' + i + ',1);renderChatImgs()"></i></span>').join('');
}
function renderChatMsgs() {
    const box = document.getElementById('chat-msgs');
    if (!box) return;
    let h = chatMsgs.map(function (m) {
        if (m.role === 'user') {
            return '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">' +
                '<div style="max-width:85%;background:#7c3aed;color:white;padding:8px 11px;border-radius:12px 12px 3px 12px;font-size:12px;white-space:pre-wrap;">' + esc(m.text) + '</div></div>';
        }
        const err = m.error ? 'color:#b91c1c;' : 'color:#334155;';
        return '<div style="display:flex;justify-content:flex-start;margin-bottom:10px;">' +
            '<div style="max-width:90%;background:white;border:1px solid #eef2f7;padding:8px 11px;border-radius:12px 12px 12px 3px;font-size:12px;' + err + 'white-space:pre-wrap;">' +
            '<i class="fas fa-wand-magic-sparkles" style="color:#7c3aed;"></i> ' + esc(m.summary || m.text || '') + '</div></div>';
    }).join('');
    if (chatBusy) {
        h += '<div style="display:flex;justify-content:flex-start;margin-bottom:10px;">' +
            '<div style="background:white;border:1px solid #eef2f7;padding:8px 11px;border-radius:12px;font-size:12px;color:#7c3aed;">' +
            '<i class="fas fa-spinner fa-spin"></i> <span id="chat-think">Building…</span></div></div>';
    }
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;
}
// live status from the AI backend (schema checks etc.) while building
function chatThink(txt) { const el = document.getElementById('chat-think'); if (el && txt) el.textContent = txt; }

function applyChatDef(env) {
    const def = env.definition || (env.header ? env : null);
    if (!def || !def.header) return false;
    normalizeLoadedDef(def);
    cur.def = def;
    if (env.name) cur.name = String(env.name);
    if (env.description != null && env.description !== '') cur.description = String(env.description);
    if (!cur.form_key && env.form_key) cur.form_key = String(env.form_key);
    return true;
}

function chatSend() {
    if (chatBusy) return;
    const ta = document.getElementById('chat-in');
    const text = (ta ? ta.value : '').trim();
    if (!text && !chatImgs.length) return;
    if (ta) ta.value = '';
    chatMsgs.push({ role: 'user', text: text || '(build from the screenshot)' });
    chatBusy = true;
    renderChatMsgs();

    const imgs = chatImgs.slice(); chatImgs = []; renderChatImgs();
    const paths = [];
    (function uploadNext() {
        if (imgs.length) {
            chatThink('Uploading screenshot ' + (paths.length + 1) + '…');
            const f = imgs.shift();
            sendMessageToCSharp({ action: 'aiSaveAttachment', fileName: f.name, dataBase64: f.b64 }, function (err, d) {
                if (!err && d && d.path) paths.push(d.path);
                uploadNext();
            });
            return;
        }
        askAi();
    })();

    function askAi() {
        chatThink('Designing…');
        const curDef = JSON.stringify(cur.def);
        const prompt =
            'CONVERSATIONAL FORM BUILD/EDIT REQUEST\n\n' +
            'You are building a form WITH the user in the WMS Forms Designer, one instruction at a time. ' +
            'This is the CURRENT form definition JSON (may be an empty starting form):\n```json\n' + curDef + '\n```\n' +
            (paths.length ? 'The user attached screenshot(s) here — READ each with your Read tool and reproduce the layout:\n' + paths.map(p => '- ' + p).join('\n') + '\n' : '') +
            'The user now says:\n"""\n' + (text || '(design from the screenshot)') + '\n"""\n\n' +
            'Apply this instruction to the definition. Keep everything the user did NOT mention unchanged. ' +
            'Follow the USER-DEFINED FORMS schema in your instructions (header.fields with lists/pickers/valueSql, details grids, reports, rules.submitChecks, actions with ords/sql/local_file/print/close). ' +
            'Verify every table/column against the schema catalog; use KNOWN DATA LOCATIONS (customers = GRFU_CUSTOMER). ' +
            'Reply with action answer whose markdown has EXACTLY ONE fenced code block:\n' +
            '```json\n{ "name": "...", "description": "...", "summary": "one short line describing what you changed", "definition": { ...FULL updated definition... } }\n```\n' +
            'Return the COMPLETE definition (not a diff). Do NOT write to the database and do NOT open a form.';
        sendMessageToCSharp({ action: 'aiChatSend', text: '[CURRENT_INSTANCE: PROD]\n' + prompt, sessionId: null, instance: 'PROD' }, function (err, resp) {
            chatBusy = false;
            if (err) { chatMsgs.push({ role: 'ai', error: true, summary: 'Request failed: ' + String(err) }); renderChatMsgs(); return; }
            if (resp && resp.requiresApproval) { chatMsgs.push({ role: 'ai', error: true, summary: 'The AI tried to run a write instead of returning the design — please rephrase.' }); renderChatMsgs(); return; }
            const md = (resp && (resp.markdown || resp.answer)) || '';
            const m = md.match(/```json\s*([\s\S]*?)```/i) || md.match(/```\s*(\{[\s\S]*?\})\s*```/);
            if (!m) { chatMsgs.push({ role: 'ai', error: true, summary: 'I couldn\'t produce a valid form from that. Reply: ' + md.slice(0, 160) }); renderChatMsgs(); return; }
            let env;
            try { env = JSON.parse(m[1]); } catch (e) { chatMsgs.push({ role: 'ai', error: true, summary: 'Returned invalid JSON: ' + e.message }); renderChatMsgs(); return; }
            if (!applyChatDef(env)) { chatMsgs.push({ role: 'ai', error: true, summary: 'The reply had no usable form definition.' }); renderChatMsgs(); return; }
            chatMsgs.push({ role: 'ai', summary: env.summary || 'Updated the form.' });
            renderChatMsgs();
            if (pageTab === 'chat') reloadTestForm();   // refresh the live preview
        });
    }
}
// surface AI backend live-status events into the chat "thinking" line too
(function () {
    const _orig = window.baiEvent;
    window.baiEvent = function (evt) {
        try { if (_orig) _orig(evt); } catch (e) { }
        if (chatBusy && evt) {
            if (evt.eventType === 'status') chatThink(evt.text || 'Working…');
            else if (evt.eventType === 'sqlRound') chatThink('Checking the schema / data (round ' + (evt.round || '') + ')…');
        }
    };
})();

loadForms();
</script>
